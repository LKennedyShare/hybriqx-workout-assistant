[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hybriqx-workout-assistant"
version = "0.1.0"
description = "Privacy-first, explicitly capped x402 client for HYBRIQX workout adaptation"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.12"
authors = [{name = "LKennedyShare"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28,<0.29",
    "x402[evm]>=2.25,<3",
    "eth-account>=0.14,<0.15",
    "pydantic>=2.13,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]
langchain = ["langchain-core>=1.6,<2"]
openai = ["openai-agents>=0.24,<1"]
release = ["build>=1.2,<2", "twine>=6,<7"]

[project.scripts]
hybriqx-workout-assistant = "hybriqx_workout_assistant.client:main"

[project.urls]
Repository = "https://github.com/LKennedyShare/hybriqx-workout-assistant"
Service = "https://www.hybriqx.com"

[tool.setuptools.packages.find]
include = ["hybriqx_workout_assistant*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
