name: Unpaid public discovery diagnostics

on:
  schedule:
    - cron: '53 3 * * *'
  workflow_dispatch:
    inputs:
      require_pypi:
        description: Fail if the public PyPI package is still pending
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: unpaid-discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public metadata and unpaid challenges only
        env:
          REQUIRE_PYPI: ${{ github.event_name == 'schedule' || inputs.require_pypi }}
        run: |
          args=()
          if [ "$REQUIRE_PYPI" = "true" ]; then args+=(--require-pypi); fi
          python scripts/check_discovery.py "${args[@]}" --output discovery.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unpaid-discovery
          path: discovery.json
          if-no-files-found: error
          retention-days: 14

  installed-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the actual PyPI distribution
        run: python -m pip install --index-url https://pypi.org/simple hybriqx-workout-assistant
      - name: Run installed client offline without a checkout or wallet
        run: |
          cd "$RUNNER_TEMP"
          hybriqx-workout-assistant --demo
          python -m hybriqx_workout_assistant --demo
